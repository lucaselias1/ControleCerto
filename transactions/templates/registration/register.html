{% extends 'base.html' %}

{% block title %}Cadastro | Finanças{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
    <div class="card auth-card shadow-sm w-100 p-4 bg-white rounded">
        <h2 class="text-center mb-4">Nova Conta</h2>
        
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    <div class="form-text text-muted" style="font-size: 0.8rem;">{{ field.help_text|safe }}</div>
                    <input type="{{ field.field.widget.input_type }}" 
                           name="{{ field.html_name }}" 
                           class="form-control">
                    {% for error in field.errors %}
                        <div class="text-danger small">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-success w-100 mt-2">Criar minha conta</button>
        </form>

        <hr>
        <p class="text-center mb-0">Já é cadastrado? <a href="{% url 'login' %}">Fazer login</a></p>
    </div>
</div>
{% endblock %}
